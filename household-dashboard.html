<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household Dashboard - Kabadiwala Connect</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>

    /* Same color variables as index.html and the Kabadiwala dashboard,
       so all pages look like one connected site */
    :root {
      --background: #1B3A3A;
      --text: #F1EDE3;
      --accent: #B5542E;
      --card-bg: #F1EDE3;
      --card-text: #14201D;
      --price-color: #7A8B6F;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: 'Work Sans', sans-serif;
      margin: 0;
    }

    h1, h2, h3 {
      font-family: 'Roboto Slab', serif;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ---------- HEADER ---------- */
    header {
      padding: 20px 0;
    }

    .logo a {
      color: var(--text);
      text-decoration: none;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .section {
      padding: 20px 0 40px;
    }


    /* ---------- RATE STRIP (small reminder of today's prices) ---------- */
    .rate-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 30px;
    }

    .rate-pill {
      background: #0F2323;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .rate-pill span {
      color: var(--price-color);
      font-weight: bold;
      margin-left: 6px;
    }


    /* ---------- THE FORM ---------- */
    .form-card {
      background: var(--card-bg);
      color: var(--card-text);
      padding: 26px;
      border-radius: 6px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .btn:hover {
      opacity: 0.9;
    }


    /* ---------- CONFIRMATION MESSAGE ---------- */
    #confirmation {
      display: none;
      background: var(--price-color);
      color: #14201D;
      padding: 16px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
    }


    /* ---------- PAST REQUESTS LIST ---------- */
    .request-card {
      background: var(--card-bg);
      color: var(--card-text);
      padding: 16px 20px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .request-card h4 {
      margin: 0 0 4px 0;
    }

    .request-card p {
      margin: 0;
      font-size: 0.88rem;
      opacity: 0.75;
    }

    #empty-requests-message {
      opacity: 0.7;
      font-size: 0.9rem;
    }

  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="container">
      <div class="logo"><a href="index.html">Kabadiwala Connect</a></div>
    </div>
  </header>

  <div class="container">

    <!-- ===== TODAY'S RATES (quick reminder) ===== -->
    <section class="section" style="padding-bottom:0;">
      <div class="rate-strip">
        <div class="rate-pill">Newspaper <span>₹14/kg</span></div>
        <div class="rate-pill">Plastic <span>₹22/kg</span></div>
        <div class="rate-pill">Iron <span>₹28/kg</span></div>
        <div class="rate-pill">E-waste <span>₹35/kg</span></div>
      </div>
    </section>

    <!-- ===== PICKUP REQUEST FORM ===== -->
    <section class="section">
      <h2>Schedule a Pickup</h2>

      <!-- This box only appears after the form is submitted -->
      <div id="confirmation"></div>

      <div class="form-card">
        <form id="pickup-form">

          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" required>
          </div>

          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" required>
          </div>

          <div class="form-group">
            <label for="material">Material Type</label>
            <select id="material">
              <option>Newspaper & Cardboard</option>
              <option>Plastic</option>
              <option>Iron / Metal scrap</option>
              <option>E-waste</option>
              <option>Mixed / Not sure</option>
            </select>
          </div>

          <div class="form-group">
            <label for="datetime">Preferred Pickup Time</label>
            <input type="datetime-local" id="datetime" required>
          </div>

          <div class="form-group">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" rows="3" placeholder="e.g. approximate quantity, gate code, etc."></textarea>
          </div>

          <button type="submit" class="btn">Request Pickup</button>

        </form>
      </div>
    </section>

    <!-- ===== PAST REQUESTS ===== -->
    <section class="section">
      <h2>Your Requests</h2>
      <p id="empty-requests-message">No requests yet — submit the form above to see it appear here.</p>
      <div id="requests-list"></div>
    </section>

  </div>

  <script>

    /* This array holds every request submitted during this visit.
       It resets if the page is refreshed, since nothing is saved
       to a server or database yet — it's just for the demo. */
    let requests = [];

    const form = document.getElementById("pickup-form");

    form.addEventListener("submit", function (event) {
      event.preventDefault(); // stops the page from reloading on submit

      // read the values the user typed/selected
      const name = document.getElementById("name").value;
      const address = document.getElementById("address").value;
      const material = document.getElementById("material").value;
      const datetime = document.getElementById("datetime").value;
      const notes = document.getElementById("notes").value;

      // save this request into our list
      requests.push({ name, address, material, datetime, notes });

      // show a confirmation message
      const confirmation = document.getElementById("confirmation");
      confirmation.style.display = "block";
      confirmation.textContent = "Pickup requested! A kabadiwala nearby will be notified.";

      // redraw the "Your Requests" list below
      renderRequests();

      // clear the form so it's ready for a new entry
      form.reset();
    });

    function renderRequests() {
      const list = document.getElementById("requests-list");
      const emptyMessage = document.getElementById("empty-requests-message");

      if (requests.length === 0) {
        emptyMessage.style.display = "block";
        list.innerHTML = "";
        return;
      }

      emptyMessage.style.display = "none";
      list.innerHTML = ""; // clear before redrawing

      requests.forEach(function (req) {
        const card = document.createElement("div");
        card.className = "request-card";
        card.innerHTML = `
          <h4>${req.material}</h4>
          <p>${req.address} • Preferred time: ${req.datetime.replace("T", " ")}</p>
        `;
        list.appendChild(card);
      });
    }

  </script>

</body>
</html>
