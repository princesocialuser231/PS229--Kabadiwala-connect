<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kabadiwala Dashboard - Kabadiwala Connect</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>

    /* Same color variables as index.html, so both pages match */
    :root {
      --background: #1B3A3A;
      --text: #F1EDE3;
      --accent: #B5542E;
      --card-bg: #F1EDE3;
      --card-text: #14201D;
      --price-color: #7A8B6F;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: 'Work Sans', sans-serif;
      margin: 0;
    }

    h1, h2, h3 {
      font-family: 'Roboto Slab', serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ---------- HEADER ---------- */
    header {
      padding: 20px 0;
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .logo a {
      color: var(--text);
      text-decoration: none;
    }


    /* ---------- TRUST SCORE ---------- */
    .trust-section {
      padding: 20px 0;
    }

    .trust-bar-bg {
      background: #0F2323;
      border-radius: 20px;
      height: 22px;
      width: 100%;
      overflow: hidden;
      margin-top: 10px;
    }

    .trust-bar-fill {
      background: var(--price-color);
      height: 100%;
      width: 20%;              /* JavaScript changes this number as pickups are logged */
      transition: width 0.4s ease;
    }

    #trust-score-text {
      margin-top: 6px;
      font-size: 0.9rem;
      opacity: 0.85;
    }


    /* ---------- PENDING PICKUPS ---------- */
    .section {
      padding: 30px 0;
    }

    .pickup-card {
      background: var(--card-bg);
      color: var(--card-text);
      padding: 18px 20px;
      border-radius: 6px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pickup-card .details h4 {
      margin: 0 0 4px 0;
    }

    .pickup-card .details p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn:hover {
      opacity: 0.9;
    }


    /* ---------- COLLECTION LOG (history table) ---------- */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      color: var(--card-text);
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      font-size: 0.9rem;
    }

    th {
      background: rgba(0,0,0,0.05);
    }

    #empty-log-message {
      opacity: 0.7;
      font-size: 0.9rem;
    }

  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="container">
      <div class="logo"><a href="index.html">Kabadiwala Connect</a></div>
    </div>
  </header>

  <div class="container">

    <!-- ===== TRUST SCORE ===== -->
    <!-- <section class="trust-section">
      <h2>Your Trust Score</h2>
      <div class="trust-bar-bg">
        <div class="trust-bar-fill" id="trust-bar"></div>
      </div>
      <p id="trust-score-text">Score: 20 / 100 — log more pickups to grow this</p>
    </section> -->

    <!-- ===== PENDING PICKUP REQUESTS ===== -->
    <section class="section">
      <h2>Pending Pickup Requests</h2>
      <div id="pickup-list">
        <!-- These pickup-card blocks are added automatically by the JavaScript below,
             based on the "pickups" list. You can add more fake requests by editing
             that list. -->
      </div>
    </section>

    <!-- ===== COLLECTION LOG ===== -->
    <section class="section">
      <h2>Your Collection Log</h2>
      <p id="empty-log-message">Nothing logged yet — mark a pickup as collected above.</p>
      <table id="log-table" style="display:none;">
        <thead>
          <tr>
            <th>Household</th>
            <th>Material</th>
            <th>Weight (kg)</th>
          </tr>
        </thead>
        <tbody id="log-table-body">
          <!-- Completed pickups get added here -->
        </tbody>
      </table>
    </section>

  </div>

  <script>

    /* ----------------------------------------------------------
       This is FAKE data, just for the demo. In a real app, this
       would come from a server/database instead of being typed
       directly into the code.
       Add or remove entries here to change what shows up above.
    ---------------------------------------------------------- */
    let pickups = [
      { id: 1, household: "Jha's House, Sector 12", material: "Newspaper & Cardboard", area: "1.2 km away" },
      { id: 2, household: "Abhinav's Residence, Sector 9", material: "Plastic bottles", area: "0.8 km away" },
      { id: 3, household: "Priya's Apartments, Block C", material: "Old iron utensils", area: "2.0 km away" }
    ];

    let trustScore = 20; // starting score, out of 100

    // Draws the pending pickup cards on the page based on the "pickups" list above
    function renderPickups() {
      const list = document.getElementById("pickup-list");
      list.innerHTML = ""; // clear whatever was there before redrawing

      if (pickups.length === 0) {
        list.innerHTML = "<p>No pending requests right now.</p>";
        return;
      }

      pickups.forEach(function (pickup) {
        const card = document.createElement("div");
        card.className = "pickup-card";
        card.innerHTML = `
          <div class="details">
            <h4>${pickup.household}</h4>
            <p>${pickup.material} • ${pickup.area}</p>
          </div>
          <button class="btn" onclick="markCollected(${pickup.id})">Mark Collected</button>
        `;
        list.appendChild(card);
      });
    }

    // Runs when "Mark Collected" is clicked on a specific pickup
    function markCollected(id) {
      // find the pickup that matches the button clicked
      const pickup = pickups.find(function (p) { return p.id === id; });
      if (!pickup) return;

      // ask for the actual weight collected (simple prompt for now)
      const weight = prompt("Enter weight collected (in kg) for " + pickup.household + ":");
      if (weight === null || weight === "") return; // user cancelled

      // add this pickup to the collection log table
      addToLog(pickup.household, pickup.material, weight);

      // remove it from the pending list
      pickups = pickups.filter(function (p) { return p.id !== id; });
      renderPickups();

      // increase trust score a little for each logged pickup
      increaseTrustScore(10);
    }

    // Adds one row to the "Collection Log" table
    function addToLog(household, material, weight) {
      document.getElementById("empty-log-message").style.display = "none";
      document.getElementById("log-table").style.display = "table";

      const tbody = document.getElementById("log-table-body");
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${household}</td>
        <td>${material}</td>
        <td>${weight}</td>
      `;
      tbody.appendChild(row);
    }

    // Grows the trust score bar, capped at 100
    function increaseTrustScore(amount) {
      trustScore = Math.min(100, trustScore + amount);
      document.getElementById("trust-bar").style.width = trustScore + "%";
      document.getElementById("trust-score-text").textContent = "Score: " + trustScore + " / 100 — log more pickups to grow this";
    }

    // Draw the initial pending pickups when the page loads
    renderPickups();

  </script>

</body>
</html>
